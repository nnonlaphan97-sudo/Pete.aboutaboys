
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#17172a">

<title>Pete Phone</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #11111a;
  color: #fff;
}

/* กรอบโทรศัพท์ */
.stage {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8px;
  background: radial-gradient(
    ellipse at center,
    #373247,
    #101017 75%
  );
}

.phone {
  position: relative;
  isolation: isolate;
  width: min(calc(100vw - 16px), 430px);
  height: min(calc(100dvh - 16px), 930px);
  aspect-ratio: 9 / 19.5;
  border: 4px solid #37363e;
  border-radius: 15px;
  overflow: hidden;
  background: #24243b;
  box-shadow:
    0 22px 65px #0009,
    inset 0 0 0 1px #ffffff12;
}

/* วอลเปเปอร์ */
.wallpaper {
  position: absolute;
  inset: 0;
  z-index: -2;
  background-color: #252b49;
  background-image: url("https://i.ibb.co/3mFG65xJ/r07qxo-R-Download.jpg");
  background-position: center;
  background-size: cover;
  background-repeat: no-repeat;
}

.screen {
  position: absolute;
  inset: 0;
  overflow: hidden;
}

/* แถบสถานะ */
.status-bar {
  position: absolute;
  z-index: 20;
  top: 0;
  left: 0;
  right: 0;
  height: 38px;
  padding: 12px 17px 0;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  font-size: 12px;
  font-weight: 700;
  pointer-events: none;
}

.status-right {
  display: flex;
  align-items: center;
  gap: 5px;
}

.fiveg {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: -.3px;
}

.signal {
  display: flex;
  align-items: flex-end;
  gap: 2px;
  height: 12px;
}

.signal i {
  display: block;
  width: 3px;
  border-radius: 2px;
  background: #fff;
}

.signal i:nth-child(1) { height: 4px; }
.signal i:nth-child(2) { height: 6px; }
.signal i:nth-child(3) { height: 9px; }
.signal i:nth-child(4) { height: 12px; }

.battery {
  position: relative;
  width: 22px;
  height: 11px;
  border: 1.3px solid #fff;
  border-radius: 3px;
  padding: 1.5px;
  margin-left: 2px;
}

.battery::after {
  content: "";
  position: absolute;
  right: -4px;
  top: 2.5px;
  width: 2px;
  height: 4px;
  border-radius: 0 2px 2px 0;
  background: #fff;
}

.battery-level {
  display: block;
  height: 100%;
  width: 82%;
  border-radius: 1px;
  background: #fff;
}

/* หน้าจอล็อก */
#lockScreen {
  display: flex;
  flex-direction: column;
  padding: 57px 15px 20px;
}

/* วันที่และเวลา */
.lock-heading {
  text-align: center;
  flex-shrink: 0;
  text-shadow: 0 2px 14px #0002;
  transform: translateY(40px);
}

.lock-date {
  font-size: 18px;
  font-weight: 600;
}

.lock-clock {
  margin-top: 3px;
  font-size: clamp(90px, 27vw, 145px);
  line-height: 1;
  font-weight: 600;
  letter-spacing: -6px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

/* กล้องหน้า */
.camera-hole {
  position: absolute;
  top: 9px;
  left: 50%;
  transform: translateX(-50%);
  width: 17px;
  height: 17px;
  border-radius: 50%;
  background: #000;
  border: 1px solid #252525;
  box-shadow: 0 0 0 1px rgba(255,255,255,.08);
  z-index: 30;
}

/* ไอคอนล็อก */
#lockScreen > .lock-status-icon {
  position: absolute;
  top: 30px;
  left: 50%;
  transform: translateX(-50%);
  width: 24px;
  height: 24px;
  z-index: 30;
  display: grid;
  place-items: center;
  pointer-events: none;
}

#lockScreen > .lock-status-icon svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(
    0 1px 2px rgba(255,255,255,.35)
  );
}

/* ขีดด้านล่าง */
.gesture-bar {
  width: 108px;
  height: 4px;
  border-radius: 99px;
  background: white;
}

.unlock-area {
  position: absolute;
  bottom: 16px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: center;
}

@media (max-height: 560px) {
  .lock-heading {
    transform: translateY(15px);
  }
}
</style>
</head>

<body>

<div class="stage">
  <main class="phone" id="phone">

    <div class="wallpaper"></div>

    <!-- แถบสถานะ -->
    <div class="status-bar">
      <span id="statusTime">12:00</span>

      <div class="status-right">
        <span class="fiveg">5G</span>

        <span class="signal">
          <i></i><i></i><i></i><i></i>
        </span>

        <span class="battery">
          <span class="battery-level"></span>
        </span>
      </div>
    </div>

    <!-- หน้าจอล็อก -->
    <section class="screen" id="lockScreen">

      <div class="camera-hole"></div>

      <!-- ไอคอนล็อก SVG -->
      <div class="lock-status-icon">
        <svg viewBox="0 0 24 24">
          <path
            d="M7 10V7a5 5 0 0 1 10 0v3h1a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h1zm2 0h6V7a3 3 0 0 0-6 0v3z"
            fill="#000"
            fill-rule="evenodd"
          />
          <circle cx="12" cy="15" r="1.7" fill="#fff"/>
          <rect
            x="11.35"
            y="15.8"
            width="1.3"
            height="2.2"
            rx=".6"
            fill="#fff"
          />
        </svg>
      </div>

      <!-- วันที่และเวลา -->
      <div class="lock-heading">
        <div class="lock-date" id="lockDate"></div>
        <div class="lock-clock" id="lockClock">12:00</div>
      </div>

      <!-- ขีดด้านล่าง -->
      <div class="unlock-area">
        <div class="gesture-bar"></div>
      </div>

    </section>

  </main>
</div>

<script>
function updateClock() {
  const now = new Date();

  const time = now.toLocaleTimeString('th-TH', {
    hour: '2-digit',
    minute: '2-digit',
    hour12: false
  });

  const date = now.toLocaleDateString('th-TH', {
    weekday: 'long',
    day: 'numeric',
    month: 'long'
  });

  document.getElementById('statusTime').textContent = time;
  document.getElementById('lockClock').textContent = time;

  document.getElementById('lockDate').textContent =
    date.replace(/^(วัน\S+?)\s+(\d+)/, '$1ที่ $2');
}

updateClock();
setInterval(updateClock, 1000);
</script>

</body>
</html>
