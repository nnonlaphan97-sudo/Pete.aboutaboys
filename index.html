
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#17172a">

<title>Pete Phone</title>

<style>
{
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #11111a;
  color: #fff;
}

/* กรอบโทรศัพท์ */
.stage {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8px;
  background: radial-gradient(
    ellipse at center,
    #373247,
    #101017 75%
  );
}

.phone {
  position: relative;
  isolation: isolate;
  width: min(calc(100vw - 16px), 430px);
  height: min(calc(100dvh - 16px), 930px);
  aspect-ratio: 9 / 19.5;
  border: 4px solid #37363e;
  border-radius: 15px;
  overflow: hidden;
  background: #24243b;
  box-shadow:
    0 22px 65px #0009,
    inset 0 0 0 1px #ffffff12;
}

/* วอลเปเปอร์ */

.wallpaper {
  position: absolute;
  inset: 0;
  z-index: 0;
  background-color: #252b49;
  background-image: url("https://i.ibb.co/3mFG65xJ/r07qxo-R-Download.jpg");
  background-position: center;
  background-size: cover;
  background-repeat: no-repeat;
}

.screen {
  position: absolute;
  inset: 0;
  z-index: 1;
  overflow: hidden;
}


.status-bar {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  height: 38px;
  padding: 12px 17px 0;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  color: #000;
  font-size: 13px;
  font-weight: 700;
  pointer-events: none;
}



.status-right {
  display: flex;
  align-items: center;
  gap: 9px;
}

.status-icon {
  width: 17px;
  height: 17px;
  display: block;
  fill: none;
  stroke: #000;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* แบตเตอรี่ทรงมน */

.battery {
  position: relative;
  width: 35px;
  height: 17px;
  border: 1.6px solid #000;
  border-radius: 7px;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}

.battery::after {
  content: "";
  position: absolute;
  right: -4px;
  top: 50%;
  transform: translateY(-50%);
  width: 3px;
  height: 7px;
  background: #000;
  border-radius: 0 3px 3px 0;
}

.battery-level {
  position: absolute;
  inset: 0 auto 0 0;
  width: 50%;
  height: 100%;
  background: #000;
  border-radius: 0;
  z-index: 0;
}

.battery-percent {
  position: relative;
  z-index: 1;
  font-size: 9px;
  font-weight: 800;
  line-height: 1;
  color: #fff;
  mix-blend-mode: difference;
}

/* วันที่และเวลา */

.lock-heading {
  position: relative;
  width: 100%;
  text-align: center;
  flex-shrink: 0;
  transform: translateY(95px);
  text-shadow: 0 2px 14px rgba(0,0,0,0.2);
}

.lock-date {
  font-size: 17px;
  font-weight: 600;
  line-height: 1.4;
  white-space: nowrap;
}

.lock-clock {
  margin-top: 5px;
  font-size: clamp(65px, 20vw, 105px);
  line-height: 1;
  font-weight: 600;
  letter-spacing: -4px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}


/* กล้องหน้า */
.camera-hole {
  position: absolute;
  top: 9px;
  left: 50%;
  transform: translateX(-50%);
  width: 17px;
  height: 17px;
  border-radius: 50%;
  background: #000;
  border: 1px solid #252525;
  box-shadow: 0 0 0 1px rgba(255,255,255,.08);
  z-index: 30;
}

/* ไอคอนล็อก */
#lockScreen > .lock-status-icon {
  position: absolute;
  top: 30px;
  left: 50%;
  transform: translateX(-50%);
  width: 24px;
  height: 24px;
  z-index: 30;
  display: grid;
  place-items: center;
  pointer-events: none;
}

#lockScreen > .lock-status-icon svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(
    0 1px 2px rgba(255,255,255,.35)
  );
}

/* ขีดด้านล่าง */
.gesture-bar {
  width: 108px;
  height: 4px;
  border-radius: 99px;
  background: white;
}

.unlock-area {
  position: absolute;
  bottom: 16px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: center;
}

@media (max-height: 560px) {
  .lock-heading {
    transform: translateY(15px);
  }
}
</style>
</head>

<body>

<div class="stage">
  <main class="phone" id="phone">

    <div class="wallpaper"></div>


<!-- แถบสถานะ -->
<div class="status-bar">

  <span class="status-name">pete</span>

  <div class="status-right">

    <!-- ปิดเสียง -->
    <svg class="status-icon"
         viewBox="0 0 24 24">
      <path d="M11 5 6 9H3v6h3l5 4V5Z"/>
      <path d="M16 9l5 6M21 9l-5 6"/>
    </svg>

    <!-- Wi-Fi -->
    <svg class="status-icon"
         viewBox="0 0 24 24">
      <path d="M2 8.5a16 16 0 0 1 20 0"/>
      <path d="M5.5 12a11 11 0 0 1 13 0"/>
      <path d="M9 15.5a5 5 0 0 1 6 0"/>
      <circle cx="12" cy="19" r="1" fill="#000" stroke="none"/>
    </svg>

    <!-- แบตเตอรี่ -->
    <div class="battery" id="battery">
      <div class="battery-level"
           id="batteryLevel"></div>
      <span class="battery-percent"
            id="batteryPercent">50</span>
    </div>

  </div>
</div>


    <!-- หน้าจอล็อก -->
    <section class="screen" id="lockScreen">

      <div class="camera-hole"></div>

      <!-- ไอคอนล็อก SVG -->
      <div class="lock-status-icon">
        <svg viewBox="0 0 24 24">
          <path
            d="M7 10V7a5 5 0 0 1 10 0v3h1a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h1zm2 0h6V7a3 3 0 0 0-6 0v3z"
            fill="#000"
            fill-rule="evenodd"
          />
          <circle cx="12" cy="15" r="1.7" fill="#fff"/>
          <rect
            x="11.35"
            y="15.8"
            width="1.3"
            height="2.2"
            rx=".6"
            fill="#fff"
          />
        </svg>
      </div>

      <!-- วันที่และเวลา -->
      <div class="lock-heading">
        <div class="lock-date" id="lockDate"></div>
        <div class="lock-clock" id="lockClock">12:00</div>
      </div>

      <!-- ขีดด้านล่าง -->
      <div class="unlock-area">
        <div class="gesture-bar"></div>
      </div>

    </section>

  </main>
</div>

<script>
function updateClock() {
  const now = new Date();

  const time = now.toLocaleTimeString('th-TH', {
    hour: '2-digit',
    minute: '2-digit',
    hour12: false
  });

  const date = now.toLocaleDateString('th-TH', {
    weekday: 'long',
    day: 'numeric',
    month: 'long'
  });
  
  document.getElementById('lockClock').textContent = time;
  
document.getElementById('lockDate').textContent =
    now.toLocaleDateString('th-TH', {
        weekday: 'long',
        day: 'numeric',
        month: 'long'
    });
}

updateClock();
setInterval(updateClock, 1000);

function setBattery(percent) {
  const value = Math.max(0, Math.min(100, percent));

  document.getElementById("batteryLevel").style.width =
    value + "%";

  document.getElementById("batteryPercent").textContent =
    value;
}

// ตั้งค่าแบตเตอรี่เริ่มต้น
setBattery(50);

</script>

</body>
</html>
