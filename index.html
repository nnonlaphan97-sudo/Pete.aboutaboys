
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#17172a">

<title>Pete Phone</title>

<style>
{
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #11111a;
  color: #fff;
}

/* กรอบโทรศัพท์ */
.stage {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8px;
  background: radial-gradient(
    ellipse at center,
    #373247,
    #101017 75%
  );
}

.phone {
  position: relative;
  isolation: isolate;
  width: min(calc(100vw - 16px), 430px);
  height: min(calc(100dvh - 16px), 930px);
  aspect-ratio: 9 / 19.5;
  border: 4px solid #37363e;
  border-radius: 15px;
  overflow: hidden;
  background: #24243b;
  box-shadow:
    0 22px 65px #0009,
    inset 0 0 0 1px #ffffff12;
}

/* วอลเปเปอร์ */

.wallpaper {
  position: absolute;
  inset: 0;
  z-index: 0;
  background-color: #252b49;
  background-image: url("https://i.ibb.co/3mFG65xJ/r07qxo-R-Download.jpg");
  background-position: center;
  background-size: cover;
  background-repeat: no-repeat;
}

.screen {
  position: absolute;
  inset: 0;
  z-index: 1;
  overflow: hidden;
}


.status-bar {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  z-index: 100;
  height: 38px;
  padding: 12px 17px 0;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  color: #000;
  font-size: 13px;
  font-weight: 700;
  pointer-events: none;
}



.status-right {
  display: flex;
  align-items: center;
  gap: 9px;
}

.status-icon {
  width: 17px;
  height: 17px;
  display: block;
  flex-shrink: 0;
  fill: none;
  stroke: #000;
  stroke-width: 2.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* แบตเตอรี่ทรงมน */


.battery {
  position: relative;
  width: 29px;
  height: 15px;
  border: 1.5px solid #000;
  border-radius: 6px;
  overflow: visible;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.battery::after {
  content: "";
  position: absolute;
  right: -4px;
  top: 50%;
  transform: translateY(-50%);
  width: 3px;
  height: 7px;
  background: #000;
  border-radius: 0 3px 3px 0;
}

.battery-level {
  position: absolute;
  top: 0;
  left: 0;
  width: 50%;
  height: 100%;
  background: #000;
  border-radius: 4px 0 0 4px;
  z-index: 0;
}


.battery-percent {
  position: relative;
  z-index: 1;
  font-size: 8px;
  font-weight: 800;
  line-height: 1;
  color: #fff;
  mix-blend-mode: difference;
}

/* วันที่และเวลา */

.lock-heading {
  position: relative;
  width: 100%;
  text-align: center;
  flex-shrink: 0;
  transform: translateY(125px);
  text-shadow: 0 2px 14px rgba(0,0,0,0.2);
}

.lock-date {
  font-size: 17px;
  font-weight: 600;
  line-height: 1.4;
  white-space: nowrap;
}

.lock-clock {
  margin-top: 5px;
  font-size: clamp(65px, 20vw, 105px);
  line-height: 1;
  font-weight: 600;
  letter-spacing: -4px;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}


/* กล้องหน้า */
.camera-hole {
  position: absolute;
  top: 9px;
  left: 50%;
  transform: translateX(-50%);
  width: 17px;
  height: 17px;
  border-radius: 50%;
  background: #000;
  border: 1px solid #252525;
  box-shadow: 0 0 0 1px rgba(255,255,255,.08);
  z-index: 30;
}

/* ไอคอนล็อก */
#lockScreen > .lock-status-icon {
  position: absolute;
  top: 37px;
  left: 50%;
  transform: translateX(-50%);
  width: 24px;
  height: 24px;
  z-index: 30;
  display: grid;
  place-items: center;
  pointer-events: none;
}

#lockScreen > .lock-status-icon svg {
  display: block;
  width: 100%;
  height: 100%;
  filter: drop-shadow(
    0 1px 2px rgba(255,255,255,.35)
  );
}

/* ขีดด้านล่าง */
.gesture-bar {
  width: 108px;
  height: 4px;
  border-radius: 99px;
  background: white;
}

.unlock-area {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 55px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 16px;
  z-index: 20;
  touch-action: none;
  cursor: grab;
}


@media (max-height: 560px) {
  .lock-heading {
    transform: translateY(15px);
  }
}

/* แถบเพลง Samsung Style */

.lock-music {
  position: relative;
  bottom: auto;
  left: auto;
  transform: none;
  width: auto;
  height: 48px;
  flex: 1;
  min-width: 0;
  border-radius: 26px;
  background: #17131e;
  display: flex;
  align-items: center;
  padding: 5px 9px;
  gap: 7px;
  color: white;
  overflow: hidden;
  z-index: 5;
  box-shadow: 0 4px 12px rgba(0,0,0,.25);
}


.lock-music::after {
  content: "";
  position: absolute;
  bottom: -9px;
  left: 18px;
  right: 18px;
  height: 20px;
  background: linear-gradient(
    90deg, #b65bff, #ff5fa2, #70d8ff
  );
  filter: blur(11px);
  opacity: .85;
}

.music-art {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  object-fit: cover;
  flex-shrink: 0;
  z-index: 1;
}

.music-content {
  flex: 1;
  min-width: 0;
  z-index: 1;
}

.music-song {
  font-size: 11px;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.music-controls {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 5px;
}

.music-controls button {
  background: none;
  border: none;
  color: white;
  padding: 0;
  display: grid;
  place-items: center;
  cursor: pointer;
}

.music-controls svg {
  width: 17px;
  height: 17px;
  fill: white;
}

/* ปุ่มโทรศัพท์และกล้อง */
.lock-actions {
  position: absolute;
  bottom: 43px;
  left: 18px;
  right: 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  z-index: 4;
}


.lock-action {
  width: 48px;
  height: 48px;
  border: none;
  border-radius: 50%;
  background: rgba(255,255,255,.25);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  display: grid;
  place-items: center;
}

.lock-action svg {
  width: 23px;
  height: 23px;
  stroke: white;
  stroke-width: 2.2;
  stroke-linecap: round;
  stroke-linejoin: round;
  fill: none;
}

/* ซ่อนหน้า PIN และหน้าโฮมตอนเริ่มต้น */
#pinScreen,
#homeScreen {
  display: none;
}

/* หน้ากรอกรหัส */
.pin-screen {
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: 85px 20px 30px;
  background: rgba(15, 15, 25, 0.55);
  backdrop-filter: blur(22px);
  -webkit-backdrop-filter: blur(22px);
  color: white;
  z-index: 5;
}


.pin-heading {
  text-align: center;
}

.pin-title {
  margin-top: 18px;
  font-size: 18px;
  font-weight: 500;
}

.pin-dots {
  display: flex;
  justify-content: center;
  gap: 19px;
  margin-top: 25px;
}

.pin-dots span {
  width: 13px;
  height: 13px;
  border: 1.5px solid white;
  border-radius: 50%;
  background: transparent;
}

.pin-dots span.filled {
  background: white;
}

.pin-error {
  height: 20px;
  margin-top: 15px;
  font-size: 12px;
  color: #ffd1d1;
}

.pin-keypad {
  display: grid;
  grid-template-columns: repeat(3, 70px);
  gap: 12px 24px;
  justify-content: center;
  margin-top: 35px;
}

.pin-keypad button {
  width: 70px;
  height: 70px;
  border: none;
  border-radius: 50%;
  background: rgba(255,255,255,.24);
  color: white;
  font-size: 29px;
  font-weight: 400;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  touch-action: manipulation;
-webkit-tap-highlight-color: transparent;
}

.pin-keypad button span {
  font-size: 9px;
  letter-spacing: 2px;
}

.pin-keypad .pin-text-btn {
  background: transparent;
  font-size: 13px;
  touch-action: manipulation;
-webkit-tap-highlight-color: transparent;
}

/* หน้าโฮม */
.home-screen {
  flex-direction: column;
  align-items: center;
  padding: 85px 20px 25px;
  z-index: 5;
  color: white;
}

.home-clock {
  font-size: 55px;
  font-weight: 600;
}

.home-date {
  font-size: 16px;
}

.home-apps {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 18px 12px;
  width: 100%;
  margin-top: 100px;
}

.home-app {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 7px;
  font-size: 11px;
}

.home-app-icon {
  width: 54px;
  height: 54px;
  border-radius: 15px;
  background: rgba(255,255,255,.75);
  color: #25273c;
  display: grid;
  place-items: center;
  font-size: 23px;
  font-weight: bold;
}

.home-dock {
  position: absolute;
  bottom: 65px;
  left: 20px;
  right: 20px;
  padding: 18px 10px;
  border-radius: 24px;
  background: rgba(255,255,255,.25);
  display: flex;
  justify-content: space-around;
  font-size: 13px;
}

.home-bottom {
  position: absolute;
  bottom: 16px;
  left: 0;
  right: 0;
  display: flex;
  justify-content: center;
  padding: 12px;
  cursor: pointer;
}

.pin-footer {
  width: 100%;
  max-width: 260px;
  display: flex;
  justify-content: space-between;
  margin-top: 18px;
}

.pin-footer button {
  background: transparent;
  border: none;
  color: white;
  font-size: 15px;
  padding: 8px;
  cursor: pointer;
 touch-action: manipulation;
-webkit-tap-highlight-color: transparent;
}

.home-weather {
  position: absolute;
  top: 75px;
  left: 22px;
  display: flex;
  align-items: center;
  gap: 12px;
  z-index: 2;
  color: #ffffff;
  background: transparent;
  border: none;
  box-shadow: none;
  padding: 0;
}

.weather-icon {
  width: 82px;
  height: 82px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.weather-icon svg {
  width: 100%;
  height: 100%;
}

.weather-info {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 1px;
}

.weather-temp {
  font-size: 53px;
  font-weight: 600;
  line-height: 1;
  letter-spacing: -2px;
  transform: translateY(15px);
}

.weather-description {
  font-size: 13px;
  font-weight: 400;
  margin-top: 5px;
}

.weather-location {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  font-weight: 400;
  margin-top: 3px;
}

</style>
</head>

<body>
<div class="stage">
  <main class="phone" id="phone">
    <div class="wallpaper"></div>

<!-- แถบสถานะ -->
<div class="status-bar">

  <span class="status-name">pete</span>

  <div class="status-right">

    <!-- ปิดเสียง -->
    <svg class="status-icon"
         viewBox="0 0 24 24">
      <path d="M11 5 6 9H3v6h3l5 4V5Z"/>
      <path d="M16 9l5 6M21 9l-5 6"/>
    </svg>

    <!-- Wi-Fi -->
    <svg class="status-icon"
         viewBox="0 0 24 24">
      <path d="M2 8.5a16 16 0 0 1 20 0"/>
      <path d="M5.5 12a11 11 0 0 1 13 0"/>
      <path d="M9 15.5a5 5 0 0 1 6 0"/>
      <circle cx="12" cy="19" r="1" fill="#000" stroke="none"/>
    </svg>

    <!-- แบตเตอรี่ -->
    <div class="battery" id="battery">
      <div class="battery-level"
           id="batteryLevel"></div>
      <span class="battery-percent"
            id="batteryPercent">50</span>
    </div>

  </div>
</div>


    <!-- หน้าจอล็อก -->
    <section class="screen" id="lockScreen">

      <div class="camera-hole"></div>

      <!-- ไอคอนล็อก SVG -->
      <div class="lock-status-icon">
        <svg viewBox="0 0 24 24">
          <path
            d="M7 10V7a5 5 0 0 1 10 0v3h1a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h1zm2 0h6V7a3 3 0 0 0-6 0v3z"
            fill="#000"
            fill-rule="evenodd"
          />
          <circle cx="12" cy="15" r="1.7" fill="#fff"/>
          <rect
            x="11.35"
            y="15.8"
            width="1.3"
            height="2.2"
            rx=".6"
            fill="#fff"
          />
        </svg>
      </div>

      <!-- วันที่และเวลา -->
      <div class="lock-heading">
        <div class="lock-date" id="lockDate"></div>
        <div class="lock-clock" id="lockClock">12:00</div>
      </div>
      
      

<!-- ปุ่มโทรศัพท์ แถบเพลง และกล้อง -->
<div class="lock-actions">

  <!-- ปุ่มโทรศัพท์ด้านซ้าย -->
  <button class="lock-action" type="button" aria-label="โทรศัพท์">
    <svg viewBox="0 0 24 24">
      <path d="M22 16.9v3a2 2 0 0 1-2.2 2
      19.8 19.8 0 0 1-8.6-3.1
      19.5 19.5 0 0 1-6-6
      A19.8 19.8 0 0 1 2.1 4.2
      2 2 0 0 1 4.1 2h3
      a2 2 0 0 1 2 1.7l.5 3
      a2 2 0 0 1-.6 1.7L7.1 10
      a16 16 0 0 0 6.9 6.9l1.6-1.9
      a2 2 0 0 1 1.7-.6l3 .5
      a2 2 0 0 1 1.7 2z"/>
    </svg>
  </button>

  <!-- แถบเพลงตรงกลาง -->
  <div class="lock-music">
    
    <img
      class="music-art"
      src="https://placehold.co/100x100/8055aa/ffffff.png?text=Music"
      alt="Album Cover"
    >

    <div class="music-content">
      <div class="music-song">
        ชื่อเพลง - ศิลปิน
      </div>

      <div class="music-controls">

        <button type="button" aria-label="เพลงก่อนหน้า">
          <svg viewBox="0 0 24 24">
            <path d="M5 5h2v14H5zM19 5 8 12l11 7z"/>
          </svg>
        </button>

        <button type="button" id="musicPlay" aria-label="เล่นหรือหยุดเพลง">
          <svg viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z"/>
          </svg>
        </button>

        <button type="button" aria-label="เพลงถัดไป">
          <svg viewBox="0 0 24 24">
            <path d="M17 5h2v14h-2zM5 5l11 7-11 7z"/>
          </svg>
        </button>

      </div>
    </div>
  </div>

  <!-- ปุ่มกล้องด้านขวา -->
  <button class="lock-action" type="button" aria-label="กล้อง">
    <svg viewBox="0 0 24 24">
      <path d="M14 4h-4L8 7H4
      a2 2 0 0 0-2 2v9
      a2 2 0 0 0 2 2h16
      a2 2 0 0 0 2-2V9
      a2 2 0 0 0-2-2h-4z"/>
      <circle cx="12" cy="13" r="3"/>
    </svg>
  </button>
</div>
      <!-- ขีดด้านล่าง -->
      <div class="unlock-area" id="unlockArea">
  <div class="gesture-bar" id="unlockGesture"></div>
</div>
    </section>
    
<!-- หน้ากรอกรหัส PIN -->
<section class="screen pin-screen" id="pinScreen">


<div class="pin-heading">
  <div class="pin-lock-icon">
    <svg viewBox="0 0 24 24" width="28" height="28">
      <path d="M7 10V7a5 5 0 0 1 10 0v3M6 10h12v11H6z"

    </svg>
  </div>

  <div class="pin-title">ป้อนรหัสผ่าน</div>

  <div class="pin-dots" id="pinDots">
    <span></span><span></span><span></span><span></span>

  <div class="pin-error" id="pinError"></div>
</div>

<div class="pin-keypad">

  <button type="button" onclick="enterPin('1')">1</button>

  <button type="button" onclick="enterPin('4')">4<span>GHI</span></button>

  <div></div>

<!-- ปุ่มยกเลิกและลบ แยกจากแป้นตัวเลข -->
<div class="pin-footer">
  <button type="button"
    onclick="showPhoneScreen('lockScreen')">ยกเลิก</button>

  <button type="button"
    onclick="deletePin()">ลบ</button>
</div>
</section>

<!-- หน้าโฮม -->
<section class="screen home-screen" id="homeScreen">

  
<div class="home-weather">
  <div class="weather-icon" id="weatherIcon">
    <svg viewBox="0 0 64 64" width="82" height="82">
      <circle cx="24" cy="23" r="12" fill="#FFD45C"/>
      <path d="M18 48h31a11 11 0 0 0 0-22 16 16 0 0 0-29-3A13 13 0 0 0 18 48Z" fill="#F1F5FA"/>
    </svg>
  </div>

  <div class="weather-info">
    <div class="weather-temp" id="weatherTemp">--°</div>
    <div class="weather-description" id="weatherDescription">
      กำลังโหลดสภาพอากาศ
    </div>
    <div class="weather-location">
      <svg viewBox="0 0 24 24" width="13" height="13"
           fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/>
        <circle cx="12" cy="10" r="2.5"/>
      </svg>
      <span>ราชวัตร</span>
    </div>
  </div>
</div>

  <div class="home-apps">
    <div class="home-app">
      <div class="home-app-icon">P</div>

    </div>

      <div class="home-app-icon">M</div>

    </div>

      <div class="home-app-icon">L</div>

    </div>
    <div class="home-app">
      <div class="home-app-icon">S</div>
      <span>Settings</span>
    </div>
  </div>

  <div class="home-dock">
    <span>Phone</span>
    <span>Safari</span>
    <span>Camera</span>
  </div>

  <div class="home-bottom" onclick="lockPhone()">
    <div class="gesture-bar"></div>
  </div>
</section>

  </main>
</div>

<script>
function updateClock() {
  const now = new Date();

  const time = now.toLocaleTimeString('th-TH', {
    hour: '2-digit',
    minute: '2-digit',
    hour12: false
  });

  const date = now.toLocaleDateString('th-TH', {
    weekday: 'long',
    day: 'numeric',
    month: 'long'
  });
  
  document.getElementById('lockClock').textContent = time;
  
document.getElementById('lockDate').textContent =
    now.toLocaleDateString('th-TH', {
        weekday: 'long',
        day: 'numeric',
        month: 'long'
    });
}

updateClock();
setInterval(updateClock, 1000);

function setBattery(percent) {
  const value = Math.max(0, Math.min(100, percent));

  document.getElementById("batteryLevel").style.width =
    value + "%";

  document.getElementById("batteryPercent").textContent =
    value;
}
// ตั้งค่าแบตเตอรี่เริ่มต้น
setBattery(50);

const PHONE_PIN = "9999";
let typedPin = "";
let pinBusy = false;

function showPhoneScreen(screenId) {
  ["lockScreen", "pinScreen", "homeScreen"].forEach(id => {
    const screen = document.getElementById(id);
    screen.style.display = id === screenId ? "flex" : "none";
  });

  if (screenId === "pinScreen") {
    typedPin = "";
    pinBusy = false;
    updatePinDots();
    document.getElementById("pinError").textContent = "";
  }

 if (screenId === "homeScreen") updateHomeWeather();
}

function updatePinDots() {
  const dots = document.querySelectorAll("#pinDots span");
  dots.forEach((dot, index) => {
    dot.classList.toggle("filled", index < typedPin.length);
  });
}

function enterPin(number) {
  if (pinBusy || typedPin.length >= 4) return;

  typedPin += number;
  updatePinDots();

  if (typedPin.length === 4) {
    pinBusy = true;

    if (typedPin === PHONE_PIN) {
      setTimeout(() => {
        showPhoneScreen("homeScreen");
      }, 250);
    } else {
      document.getElementById("pinError").textContent =
        "รหัสผ่านไม่ถูกต้อง";

      setTimeout(() => {
        typedPin = "";
        pinBusy = false;
        updatePinDots();
      }, 700);
    }
  }
}

function deletePin() {
  if (pinBusy) return;
  typedPin = typedPin.slice(0, -1);
  updatePinDots();
}


/* พยากรณ์อากาศราชวัตร กรุงเทพฯ */
const WEATHER_LAT = 13.79;
const WEATHER_LON = 100.52;

function getWeatherDescription(code) {
  if (code === 0) return "ท้องฟ้าแจ่มใส";
  if (code <= 2) return "มีเมฆบางส่วน";
  if (code === 3) return "เมฆมาก";
  if (code <= 48) return "มีหมอก";
  if (code <= 67) return "มีฝนตก";
  if (code <= 82) return "มีฝนตกเป็นช่วง ๆ";
  if (code >= 95) return "มีฝนฟ้าคะนอง";
  return "สภาพอากาศแปรปรวน";
}

function getWeatherIcon(code) {
  if (code <= 1) {
    return `<svg viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="15" fill="#FFD45C"/>
      <g stroke="#FFD45C" stroke-width="4"
         stroke-linecap="round">
        <path d="M32 5v8M32 51v8M5 32h8M51 32h8
        M13 13l6 6M45 45l6 6M13 51l6-6M45 19l6-6"/>
      </g>
    </svg>`;
  }

  if (code >= 51) {
    return `<svg viewBox="0 0 64 64">
      <path d="M15 42h34a12 12 0 0 0-2-24
      17 17 0 0 0-31 3A11 11 0 0 0 15 42Z"
      fill="#E9F0F8"/>
      <g stroke="#78C5FF" stroke-width="3"
         stroke-linecap="round">
        <path d="M21 47l-3 7M34 47l-3 7M47 47l-3 7"/>
      </g>
    </svg>`;
  }

  return `<svg viewBox="0 0 64 64">
    <circle cx="24" cy="23" r="12" fill="#FFD45C"/>
    <path d="M18 48h31a11 11 0 0 0 0-22
    16 16 0 0 0-29-3A13 13 0 0 0 18 48Z"
    fill="#F1F5FA"/>
  </svg>`;
}

async function updateHomeWeather() {
  const temp = document.getElementById("weatherTemp");
  const desc = document.getElementById("weatherDescription");
  const icon = document.getElementById("weatherIcon");

  try {
    const url =
      `https://api.open-meteo.com/v1/forecast` +
      `?latitude=${WEATHER_LAT}` +
      `&longitude=${WEATHER_LON}` +
      `&current=temperature_2m,weather_code` +
      `&timezone=Asia%2FBangkok`;

    const response = await fetch(url);
    if (!response.ok) throw new Error("Weather API error");

    const data = await response.json();
    const weather = data.current;

    temp.textContent =
      Math.round(weather.temperature_2m) + "°";

    desc.textContent =
      getWeatherDescription(weather.weather_code);

    icon.innerHTML =
      getWeatherIcon(weather.weather_code);

  } catch (error) {
    if (temp.textContent === "--°") {
      desc.textContent = "ไม่สามารถโหลดสภาพอากาศ";
    }
    console.error(error);
  }
}

updateHomeWeather();

/* อัปเดตทุก 15 นาที */
setInterval(updateHomeWeather, 15 * 60 * 1000);


function lockPhone() {
  showPhoneScreen("lockScreen");
}


/* ปัดขึ้นจากขีดสีขาวเพื่อเปิดหน้ารหัส */
const unlockArea = document.getElementById("unlockArea");

let swipeStartY = null;
let swipeStartX = null;

unlockArea.addEventListener("touchstart", function(e) {
  swipeStartY = e.touches[0].clientY;
  swipeStartX = e.touches[0].clientX;
}, { passive: true });

unlockArea.addEventListener("touchend", function(e) {
  if (swipeStartY === null) return;

  const endY = e.changedTouches[0].clientY;
  const endX = e.changedTouches[0].clientX;

  const distanceY = swipeStartY - endY;
  const distanceX = Math.abs(endX - swipeStartX);

  if (distanceY > 45 && distanceY > distanceX) {
    showPhoneScreen("pinScreen");
  }

  swipeStartY = null;
  swipeStartX = null;
}, { passive: true });

</script>
